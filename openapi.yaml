openapi: 3.0.3
info:
  title: Wichtel API
  description: >
    Secret Santa ("Wichteln") tool without registration. Access is exclusively via
    random tokens in the URL: one admin token (manage group + drawing), one join
    token (join via link shared by the admin), one personal token per participant
    (own wishes + after the drawing the list of the assigned person). Invalid or
    expired tokens uniformly return 404 to avoid a token oracle.
  version: 0.1.0
servers:
  - url: /
tags:
  - name: groups
    description: Create a group and manage it (as admin)
  - name: join
    description: Join via the shared join link
  - name: me
    description: Participant view via the personal link
  - name: admin
    description: Admin actions (drawing, participant management)

paths:
  /api/groups:
    post:
      tags: [groups]
      summary: Create a new Wichtel group
      description: >
        Creates the group; the creator automatically becomes the admin. The response
        contains the admin token and join token exactly once in clear text. The admin
        token is afterwards stored only as a hash and can NEVER be shown again.
      operationId: createGroup
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateGroupRequest'
      responses:
        '201':
          description: Group created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateGroupResponse'
        '422':
          $ref: '#/components/responses/ValidationError'
        '429':
          $ref: '#/components/responses/RateLimited'

  /api/groups/{adminToken}:
    delete:
      tags: [admin]
      summary: Delete the group (irreversible)
      description: >-
        Deletes the group including ALL participants, wishes, exclusions and
        assignments. The admin token and all personal tokens become invalid.
        Irreversible — there is no undo. Returns 204 on success.
      operationId: deleteGroup
      parameters:
        - $ref: '#/components/parameters/AdminToken'
      responses:
        '204':
          description: Group and all its data deleted
        '404':
          $ref: '#/components/responses/NotFound'
    get:
      tags: [admin]
      summary: Admin view of the group
      operationId: getGroupAdmin
      parameters:
        - $ref: '#/components/parameters/AdminToken'
      responses:
        '200':
          description: Group including participant list (without other participants' tokens)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminGroupView'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      tags: [admin]
      summary: Change title, description or target date
      operationId: updateGroup
      parameters:
        - $ref: '#/components/parameters/AdminToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateGroupRequest'
      responses:
        '200':
          description: Updated group
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminGroupView'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationError'

  /api/groups/{adminToken}/participants:
    get:
      tags: [admin]
      summary: List participants
      operationId: listParticipants
      parameters:
        - $ref: '#/components/parameters/AdminToken'
      responses:
        '200':
          description: Participants of the group
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Participant'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/groups/{adminToken}/participants/{participantId}:
    delete:
      tags: [admin]
      summary: Remove a participant before the drawing
      description: >
        Only while the group has not been drawn (drawnAt == null) — afterwards 409.
        The participant's personal token becomes invalid; their wishes are deleted.
      operationId: removeParticipant
      parameters:
        - $ref: '#/components/parameters/AdminToken'
        - $ref: '#/components/parameters/ParticipantId'
      responses:
        '204':
          description: Participant removed
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/ConflictDrawn'

  /api/groups/{adminToken}/participants/{participantId}/link:
    post:
      tags: [admin]
      summary: Regenerate a participant's personal link
      description: >
        For the case "a participant lost their link": generates a new personal token
        and invalidates the old one. Also possible after the drawing (the participant
        continues to see their assignee).
      operationId: regenerateParticipantLink
      parameters:
        - $ref: '#/components/parameters/AdminToken'
        - $ref: '#/components/parameters/ParticipantId'
      responses:
        '200':
          description: New personal link
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PersonalLinkResponse'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/groups/{adminToken}/draw:
    post:
      tags: [admin]
      summary: Draw Secret Santas (one-time)
      description: >-
        Generates a random assignment where every participant gives exactly one
        gift and receives exactly one gift. Nobody draws themselves, and all
        exclusions configured by the admin are respected: giver A never draws
        receiver B if (A, B) is excluded. If no valid assignment exists with the
        configured exclusions, the drawing fails with 422 DRAW_UNSOLVABLE and
        nothing is persisted. The drawing is irreversible; a second call returns
        409. The join link is deactivated afterwards. Requires at least 2
        participants; mutual pairs (A draws B, B draws A) are allowed.
      operationId: drawAssignments
      parameters:
        - $ref: '#/components/parameters/AdminToken'
      responses:
        '200':
          description: Drawing successful
          content:
            application/json:
              schema:
                type: object
                required: [drawnAt, assignmentCount]
                properties:
                  drawnAt:
                    type: string
                    format: date-time
                  assignmentCount:
                    type: integer
                    minimum: 2
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/ConflictDrawn'
        '422':
          description: Too few participants (fewer than 2) or no valid assignment possible with the configured exclusions
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          examples:
            tooFew:
              summary: Fewer than 2 participants
              value:
                code: TOO_FEW_PARTICIPANTS
                message: 'At least 2 participants are required.'
            unsolvable:
              summary: No valid assignment possible with the exclusions
              value:
                code: DRAW_UNSOLVABLE
                message: 'No valid assignment possible with the configured exclusions.'

  /api/groups/{adminToken}/exclusions:
    get:
      tags: [admin]
      summary: List exclusions
      operationId: listExclusions
      parameters:
        - $ref: '#/components/parameters/AdminToken'
      responses:
        '200':
          description: All exclusions of the group
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Exclusion'
        '404':
          $ref: '#/components/responses/NotFound'
    put:
      tags: [admin]
      summary: Replace all exclusions
      description: >-
        Sets the complete list of exclusions (full replacement, idempotent):
        giver A never draws receiver B for each {giverId, receiverId}. Exclusions
        are one-directional only — excluding (A, B) does NOT exclude (B, A).
        Self-exclusions (giver == receiver) and unknown participant IDs are
        rejected with 422. Only possible before the drawing (afterwards 409).
      operationId: replaceExclusions
      parameters:
        - $ref: '#/components/parameters/AdminToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: '#/components/schemas/ExclusionIn'
      responses:
        '200':
          description: Stored exclusions (deduplicated, in storage order)
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Exclusion'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/ConflictDrawn'
        '422':
          $ref: '#/components/responses/ValidationError'

  /api/join/{joinToken}:
    post:
      tags: [join]
      summary: Join a group via join link
      description: >
        Creates a participant and returns the personal token exactly once in clear
        text (afterwards stored only as a hash, not recoverable). After the drawing
        the join link is deactivated (409).
      operationId: joinGroup
      parameters:
        - $ref: '#/components/parameters/JoinToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/JoinRequest'
      responses:
        '201':
          description: Joined; personal link created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JoinResponse'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: Joining no longer possible (already drawn) or the name is already taken in this group (DUPLICATE_NAME)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          examples:
            drawn:
              summary: Already drawn
              value:
                code: ALREADY_DRAWN
                message: 'The drawing has already taken place. Joining is no longer possible.'
            duplicate:
              summary: Name already taken in this group
              value:
                code: DUPLICATE_NAME
                message: 'This name is already taken in this group.'
        '422':
          $ref: '#/components/responses/ValidationError'
        '429':
          $ref: '#/components/responses/RateLimited'

  /api/me/{personalToken}:
    get:
      tags: [me]
      summary: Get own data and wishes
      operationId: getMe
      parameters:
        - $ref: '#/components/parameters/PersonalToken'
      responses:
        '200':
          description: Own participant data
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MeResponse'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      tags: [me]
      summary: Leave the group
      description: >
        Self-service leave before the drawing (personal token and wishes are
        deleted). After the drawing 409 — the assignment is fixed.
      operationId: leaveGroup
      parameters:
        - $ref: '#/components/parameters/PersonalToken'
      responses:
        '204':
          description: Left the group
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/ConflictDrawn'

  /api/me/{personalToken}/wishes:
    post:
      tags: [me]
      summary: Add a wish
      description: >
        Only before the drawing. After the drawing 409 — wishes are frozen,
        since the assigned Secret Santa can already see them.
      operationId: addWish
      parameters:
        - $ref: '#/components/parameters/PersonalToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WishRequest'
      responses:
        '201':
          description: Wish created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Wish'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: Already drawn — wishes are frozen
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          $ref: '#/components/responses/ValidationError'

  /api/me/{personalToken}/wishes/{wishId}:
    put:
      tags: [me]
      summary: Change or reorder a wish
      description: >
        Only before the drawing. After the drawing 409 — wishes are frozen,
        since the assigned Secret Santa can already see them.
      operationId: updateWish
      parameters:
        - $ref: '#/components/parameters/PersonalToken'
        - $ref: '#/components/parameters/WishId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WishRequest'
      responses:
        '200':
          description: Wish updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Wish'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: Already drawn — wishes are frozen
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          $ref: '#/components/responses/ValidationError'
    delete:
      tags: [me]
      summary: Delete a wish
      description: >
        Only before the drawing. After the drawing 409 — wishes are frozen,
        since the assigned Secret Santa can already see them.
      operationId: deleteWish
      parameters:
        - $ref: '#/components/parameters/PersonalToken'
        - $ref: '#/components/parameters/WishId'
      responses:
        '204':
          description: Wish deleted
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: Already drawn — wishes are frozen
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/me/{personalToken}/assignee:
    get:
      tags: [me]
      summary: Get the assigned person and their wishes
      description: >
        Only after the drawing has taken place. Before the drawing 409. The server
        verifies that the requester is a participant of the drawn group.
      operationId: getAssignee
      parameters:
        - $ref: '#/components/parameters/PersonalToken'
      responses:
        '200':
          description: The person to gift, with their wishes
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Assignee'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: Not drawn yet
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

components:
  parameters:
    AdminToken:
      name: adminToken
      in: path
      required: true
      schema:
        type: string
        pattern: '^[A-Za-z0-9_-]{43}$'
      description: Admin token from the URL (/g/{adminToken})
    JoinToken:
      name: joinToken
      in: path
      required: true
      schema:
        type: string
        pattern: '^[A-Za-z0-9_-]{43}$'
      description: Join token from the shared join URL (/join/{joinToken})
    PersonalToken:
      name: personalToken
      in: path
      required: true
      schema:
        type: string
        pattern: '^[A-Za-z0-9_-]{43}$'
      description: Participant's personal token from the URL (/p/{personalToken})
    ParticipantId:
      name: participantId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    WishId:
      name: wishId
      in: path
      required: true
      schema:
        type: string
        format: uuid

  responses:
    NotFound:
      description: Unknown or invalid token respectively resource (uniform message)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    ConflictDrawn:
      description: Action not possible because the group has already been drawn
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    ValidationError:
      description: Validation error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    RateLimited:
      description: Too many requests (rate limit)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'

  schemas:
    Error:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
          description: >
            Machine-readable error code, e.g. NOT_FOUND, ALREADY_DRAWN,
            RATE_LIMITED, VALIDATION
        message:
          type: string
          description: Human-readable error message (English)

    CreateGroupRequest:
      type: object
      required: [title]
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 100
          example: Christmas 2026
        description:
          type: string
          maxLength: 2000
          description: Short info text for all participants
          example: "As every year: budget 30 euros. Drawing takes place on December 20."
        drawDate:
          type: string
          format: date
          description: >
            Target date on which the admin wants to trigger the drawing via button.
            Purely informational — the drawing is triggered manually by the admin.

    UpdateGroupRequest:
      type: object
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 100
        description:
          type: string
          maxLength: 2000
        drawDate:
          type: string
          format: date

    CreateGroupResponse:
      type: object
      required: [group, adminToken, adminUrl, joinToken, joinUrl]
      properties:
        group:
          $ref: '#/components/schemas/AdminGroupView'
        adminToken:
          type: string
          description: Clear text, returned exactly once — not recoverable
        adminUrl:
          type: string
          description: Ready-made admin URL (/g/{adminToken})
        joinToken:
          type: string
          description: Clear text; to be shared by the admin with everyone
        joinUrl:
          type: string
          description: Ready-made join URL (/join/{joinToken})

    AdminGroupView:
      type: object
      required: [id, title, drawnAt, joinUrl, participants]
      properties:
        id:
          type: string
          format: uuid
        title:
          type: string
        description:
          type: string
          nullable: true
        drawDate:
          type: string
          format: date
          nullable: true
        drawnAt:
          type: string
          format: date-time
          nullable: true
          description: null = not drawn yet
        joinUrl:
          type: string
          description: >
            Join URL remains retrievable for the admin at any time (the link is
            meant to be shared, so it must be reconstructable — in contrast to
            admin and personal tokens).
        participants:
          type: array
          items:
            $ref: '#/components/schemas/Participant'

    Participant:
      type: object
      required: [id, name, joinedAt]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        joinedAt:
          type: string
          format: date-time

    ExclusionIn:
      type: object
      required: [giverId, receiverId]
      properties:
        giverId:
          type: string
          format: uuid
          description: Participant who must not draw the receiver.
        receiverId:
          type: string
          format: uuid
          description: Participant whom the giver must not draw.

    Exclusion:
      type: object
      required: [giverId, receiverId, giverName, receiverName]
      properties:
        giverId:
          type: string
          format: uuid
        receiverId:
          type: string
          format: uuid
        giverName:
          type: string
          description: Convenience copy of the giver's name (for admin UI display)
        receiverName:
          type: string
          description: Convenience copy of the receiver's name (for admin UI display)

    JoinRequest:
      type: object
      required: [name]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 60
          example: Michael
          description: >-
            Must be unique within the group (case-insensitive, surrounding
            whitespace is trimmed). Duplicate names are rejected with 409.

    JoinResponse:
      type: object
      required: [participant, personalToken, personalUrl]
      properties:
        participant:
          $ref: '#/components/schemas/Participant'
        personalToken:
          type: string
          description: Clear text, returned exactly once — not recoverable
        personalUrl:
          type: string
          description: Ready-made personal URL (/p/{personalToken})

    PersonalLinkResponse:
      type: object
      required: [participantId, personalToken, personalUrl]
      properties:
        participantId:
          type: string
          format: uuid
        personalToken:
          type: string
        personalUrl:
          type: string

    WishRequest:
      type: object
      required: [text]
      properties:
        text:
          type: string
          minLength: 1
          maxLength: 500
          example: Well-thought-out grilling accessories
        position:
          type: integer
          minimum: 0
          description: >
            Order (0 = first). If omitted: append at the end. To reorder, update
            the wish with a new position via PUT.

    Wish:
      type: object
      required: [id, position, text]
      properties:
        id:
          type: string
          format: uuid
        position:
          type: integer
          minimum: 0
        text:
          type: string

    MeResponse:
      type: object
      required: [groupTitle, participant, wishes, drawn]
      properties:
        groupTitle:
          type: string
        groupDescription:
          type: string
          nullable: true
        drawDate:
          type: string
          format: date
          nullable: true
        drawn:
          type: boolean
          description: false = drawing still pending, true = drawing has taken place
        drawnAt:
          type: string
          format: date-time
          nullable: true
        participant:
          $ref: '#/components/schemas/Participant'
        wishes:
          type: array
          items:
            $ref: '#/components/schemas/Wish'

    Assignee:
      type: object
      required: [name, wishes]
      properties:
        name:
          type: string
          description: Name of the assigned person (the one you gift)
        wishes:
          type: array
          items:
            $ref: '#/components/schemas/Wish'
